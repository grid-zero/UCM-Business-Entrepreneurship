<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title and page.url != "/" %}{{ title }} · {% endif %}{{ site.name }}</title>
  <meta name="description" content="{{ description | default: summary | default: site.description | escape }}">
  <meta property="og:title" content="{{ title | default: site.name | escape }}">
  <meta property="og:description" content="{{ description | default: summary | default: site.description | escape }}">
  <meta property="og:type" content="{% if layout == 'layouts/post.html' %}article{% else %}website{% endif %}">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {% include "partials/header.html" %}

  <main id="main">
    {{ content }}
  </main>

  {% include "partials/footer.html" %}

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
